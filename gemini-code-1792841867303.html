<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>your gift</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05030a;
      font-family: 'Pretendard', sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #canvas-container:active {
      cursor: grabbing;
    }

    /* 이미지 업로드 UI */
    #upload-container {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 100;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .custom-file-upload {
      background: linear-gradient(135deg, #ff0055, #ff5500);
      color: white;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .custom-file-upload:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 0, 85, 0.6);
    }
    #file-input {
      display: none;
    }
  </style>

  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- 사진 업로드 버튼 -->
  <div id="upload-container">
    <label for="file-input" class="custom-file-upload">
      사진 선택하기
    </label>
    <input type="file" id="file-input" accept="image/*">
  </div>

  <div id="canvas-container"></div>

  <script>
    // ----------------------------------------------------
    // 1. 순수 멜로디 악기 생일 축하 노래 연주 엔진
    // ----------------------------------------------------
    class MelodyAudioEngine {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.bpm = 100;
        this.step = 0;
        this.timer = null;
      }

      init() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
      }

      // 맑은 벨/오르골 소리 합성
      playTone(freq, duration, type = 'sine', volume = 0.15) {
        if (!this.ctx || freq <= 0) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);

        gain.gain.setValueAtTime(volume, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(t);
        osc.stop(t + duration);
      }

      startHappyBirthdayMelody() {
        this.init();
        if (this.isPlaying || !this.ctx) return;
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        this.isPlaying = true;

        // 생일 축하 노래 음계 (Hz)
        const C4 = 261.63, D4 = 293.66, E4 = 329.63, F4 = 349.23, G4 = 392.00, A4 = 440.00, B4 = 493.88;
        const C5 = 523.25, D5 = 587.33, E5 = 659.25, F5 = 698.46, G5 = 783.99;

        // 멜로디 악보 (노트, 박자 길이)
        const melody = [
          { f: C4, d: 0.3 }, { f: C4, d: 0.3 }, { f: D4, d: 0.6 }, { f: C4, d: 0.6 }, { f: F4, d: 0.6 }, { f: E4, d: 1.0 },
          { f: C4, d: 0.3 }, { f: C4, d: 0.3 }, { f: D4, d: 0.6 }, { f: C4, d: 0.6 }, { f: G4, d: 0.6 }, { f: F4, d: 1.0 },
          { f: C4, d: 0.3 }, { f: C4, d: 0.3 }, { f: C5, d: 0.6 }, { f: A4, d: 0.6 }, { f: F4, d: 0.6 }, { f: E4, d: 0.6 }, { f: D4, d: 0.8 },
          { f: A4, d: 0.3 }, { f: A4, d: 0.3 }, { f: F4, d: 0.6 }, { f: G4, d: 0.6 }, { f: F4, d: 1.2 }
        ];

        let noteIdx = 0;
        const playNext = () => {
          if (!this.isPlaying) return;
          const current = melody[noteIdx];

          // 메인 벨 멜로디 연주
          this.playTone(current.f, current.d * 1.2, 'triangle', 0.22);
          // 하모니 보조 연주
          this.playTone(current.f * 0.5, current.d * 1.5, 'sine', 0.12);

          noteIdx = (noteIdx + 1) % melody.length;
          this.timer = setTimeout(playNext, current.d * 750);
        };

        playNext();
      }
    }

    const audioEngine = new MelodyAudioEngine();

    // ----------------------------------------------------
    // 2. Three.js 기본 씬 설정
    // ----------------------------------------------------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0518, 0.032);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 6, 14);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.02;
    controls.minDistance = 5;
    controls.maxDistance = 25;
    controls.target.set(0, 1.5, 0);

    // 환경 조명
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfff5ea, 1.2);
    dirLight.position.set(8, 15, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    // 회전 스포트라이트 시스템
    const discoGroup = new THREE.Group();
    scene.add(discoGroup);
    
    const spotColors = [0xff0055, 0x00ffcc, 0xffcc00, 0x9900ff];
    const spotLights = [];
    spotColors.forEach((color, i) => {
      const spot = new THREE.SpotLight(color, 2.8, 25, Math.PI / 5, 0.4, 1);
      spot.position.set(Math.cos(i * Math.PI / 2) * 8, 11, Math.sin(i * Math.PI / 2) * 8);
      spot.target.position.set(0, 0, 0);
      scene.add(spot);
      scene.add(spot.target);
      spotLights.push(spot);
    });

    // 바닥
    const floorGeo = new THREE.CylinderGeometry(12, 12.5, 0.4, 64);
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x181128,
      roughness: 0.3,
      metalness: 0.4
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.position.y = -0.2;
    floor.receiveShadow = true;
    scene.add(floor);

    // 드래그 레이캐스팅 평면
    const dragPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(100, 100),
      new THREE.MeshBasicMaterial({ visible: false })
    );
    dragPlane.rotation.x = -Math.PI / 2;
    scene.add(dragPlane);

    // ----------------------------------------------------
    // 3. 얼굴 텍스처 관리 (사진 업로드 지원)
    // ----------------------------------------------------
    let currentFaceTexture = null;
    const allCharacterMaterials = [];

    function createDefaultFaceTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#f8d2b0';
      ctx.fillRect(0, 0, 256, 256);

      ctx.fillStyle = '#1b1310';
      ctx.beginPath();
      ctx.arc(128, 70, 95, Math.PI, 0);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(80, 125, 18, 22, 0, 0, Math.PI * 2);
      ctx.ellipse(176, 125, 18, 22, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(84, 128, 9, 0, Math.PI * 2);
      ctx.arc(172, 128, 9, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#e0986c';
      ctx.beginPath();
      ctx.arc(128, 155, 16, 0, Math.PI);
      ctx.fill();

      ctx.fillStyle = '#800c0c';
      ctx.beginPath();
      ctx.arc(128, 185, 30, 0, Math.PI);
      ctx.fill();

      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return tex;
    }

    currentFaceTexture = createDefaultFaceTexture();

    // ----------------------------------------------------
    // 4. 캐릭터 생성
    // ----------------------------------------------------
    function createKaneCharacter(isBboy = false) {
      const group = new THREE.Group();

      const headGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xf8d2b0, roughness: 0.6 });
      const faceMat = new THREE.MeshStandardMaterial({ map: currentFaceTexture, roughness: 0.5 });
      const hairMat = new THREE.MeshStandardMaterial({ color: 0x221814, roughness: 0.8 });

      allCharacterMaterials.push(faceMat);

      const headMaterials = [skinMat, skinMat, hairMat, skinMat, faceMat, hairMat];
      const head = new THREE.Mesh(headGeo, headMaterials);
      head.position.y = 1.9;
      head.castShadow = true;
      group.add(head);

      const bodyGeo = new THREE.BoxGeometry(1.0, 1.1, 0.6);
      const shirtMat = new THREE.MeshStandardMaterial({ 
        color: isBboy ? 0xd90429 : 0x1d3557, 
        roughness: 0.5 
      });
      const body = new THREE.Mesh(bodyGeo, shirtMat);
      body.position.y = 1.05;
      body.castShadow = true;
      group.add(body);

      const limbMat = new THREE.MeshStandardMaterial({ color: isBboy ? 0x111111 : 0x457b9d });
      const armGeo = new THREE.BoxGeometry(0.26, 0.75, 0.26);
      armGeo.translate(0, -0.32, 0);

      const leftArmGroup = new THREE.Group();
      leftArmGroup.position.set(-0.62, 1.45, 0);
      leftArmGroup.add(new THREE.Mesh(armGeo, limbMat));
      group.add(leftArmGroup);

      const rightArmGroup = new THREE.Group();
      rightArmGroup.position.set(0.62, 1.45, 0);
      rightArmGroup.add(new THREE.Mesh(armGeo, limbMat));
      group.add(rightArmGroup);

      const legGeo = new THREE.BoxGeometry(0.32, 0.52, 0.32);
      legGeo.translate(0, -0.26, 0);

      const leftLegGroup = new THREE.Group();
      leftLegGroup.position.set(-0.28, 0.52, 0);
      leftLegGroup.add(new THREE.Mesh(legGeo, limbMat));
      group.add(leftLegGroup);

      const rightLegGroup = new THREE.Group();
      rightLegGroup.position.set(0.28, 0.52, 0);
      rightLegGroup.add(new THREE.Mesh(legGeo, limbMat));
      group.add(rightLegGroup);

      return {
        mesh: group,
        head,
        leftArmGroup,
        rightArmGroup,
        leftLegGroup,
        rightLegGroup,
        isBboy,
        dancePhase: Math.random() * Math.PI * 2,
        danceSpeed: 7 + Math.random() * 3,
        spawnProgress: 0,
        spawnDelay: 0,
        targetPos: new THREE.Vector3(),
        startPos: new THREE.Vector3(0, 0.5, 0),
        baseYRotation: 0,
        isBeingDragged: false
      };
    }

    // ----------------------------------------------------
    // 5. 고퀄리티 3D 선물 상자
    // ----------------------------------------------------
    const giftGroup = new THREE.Group();
    scene.add(giftGroup);

    const boxSize = 2.0;
    const boxMat = new THREE.MeshStandardMaterial({ color: 0xd90429, roughness: 0.25, metalness: 0.1 });
    const ribbonMat = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.2, metalness: 0.85 });
    const innerMat = new THREE.MeshStandardMaterial({ color: 0x3d0012, roughness: 0.9 });

    const outerBox = new THREE.Mesh(new THREE.BoxGeometry(boxSize, boxSize * 0.85, boxSize), boxMat);
    outerBox.position.y = (boxSize * 0.85) / 2;
    outerBox.castShadow = true;
    outerBox.receiveShadow = true;
    giftGroup.add(outerBox);

    const rib1 = new THREE.Mesh(new THREE.BoxGeometry(boxSize + 0.05, boxSize * 0.86, 0.36), ribbonMat);
    rib1.position.y = (boxSize * 0.85) / 2;
    giftGroup.add(rib1);

    const rib2 = new THREE.Mesh(new THREE.BoxGeometry(0.36, boxSize * 0.86, boxSize + 0.05), ribbonMat);
    rib2.position.y = (boxSize * 0.85) / 2;
    giftGroup.add(rib2);

    const innerBox = new THREE.Mesh(new THREE.BoxGeometry(boxSize - 0.1, boxSize * 0.8, boxSize - 0.1), innerMat);
    innerBox.position.y = (boxSize * 0.85) / 2 + 0.05;
    giftGroup.add(innerBox);

    const lidHingeGroup = new THREE.Group();
    lidHingeGroup.position.set(0, boxSize * 0.85, -boxSize / 2);

    const lidMesh = new THREE.Mesh(new THREE.BoxGeometry(boxSize + 0.12, 0.3, boxSize + 0.12), boxMat);
    lidMesh.position.set(0, 0.15, boxSize / 2);
    lidMesh.castShadow = true;
    lidHingeGroup.add(lidMesh);

    const lidRib1 = new THREE.Mesh(new THREE.BoxGeometry(boxSize + 0.16, 0.32, 0.38), ribbonMat);
    lidRib1.position.set(0, 0.15, boxSize / 2);
    lidHingeGroup.add(lidRib1);

    const lidRib2 = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.32, boxSize + 0.16), ribbonMat);
    lidRib2.position.set(0, 0.15, boxSize / 2);
    lidHingeGroup.add(lidRib2);

    const bowGroup = new THREE.Group();
    bowGroup.position.set(0, 0.32, boxSize / 2);

    const torusGeo = new THREE.TorusGeometry(0.32, 0.09, 16, 32);
    const loop1 = new THREE.Mesh(torusGeo, ribbonMat);
    loop1.rotation.y = Math.PI / 4;
    loop1.rotation.x = Math.PI / 6;
    bowGroup.add(loop1);

    const loop2 = new THREE.Mesh(torusGeo, ribbonMat);
    loop2.rotation.y = -Math.PI / 4;
    loop2.rotation.x = Math.PI / 6;
    bowGroup.add(loop2);

    const knot = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 16), ribbonMat);
    bowGroup.add(knot);

    lidHingeGroup.add(bowGroup);
    giftGroup.add(lidHingeGroup);

    // ----------------------------------------------------
    // 6. 폭죽 & 오색 컨페티 파티클 시스템
    // ----------------------------------------------------
    const particleCount = 200;
    const particleGeo = new THREE.BufferGeometry();
    const particlePos = new Float32Array(particleCount * 3);
    const particleVels = [];
    const particleColors = new Float32Array(particleCount * 3);

    const colorPalette = [
      new THREE.Color(0xff0055),
      new THREE.Color(0x00ffcc),
      new THREE.Color(0xffcc00),
      new THREE.Color(0xff3399),
      new THREE.Color(0x00ff66)
    ];

    for (let i = 0; i < particleCount; i++) {
      particlePos[i * 3] = 0;
      particlePos[i * 3 + 1] = 1.0;
      particlePos[i * 3 + 2] = 0;

      particleVels.push({
        x: (Math.random() - 0.5) * 16,
        y: Math.random() * 14 + 8,
        z: (Math.random() - 0.5) * 16
      });

      const col = colorPalette[Math.floor(Math.random() * colorPalette.length)];
      particleColors[i * 3] = col.r;
      particleColors[i * 3 + 1] = col.g;
      particleColors[i * 3 + 2] = col.b;
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
    particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

    const particleMat = new THREE.PointsMaterial({
      size: 0.25,
      vertexColors: true,
      transparent: true,
      opacity: 0
    });

    const particleSystem = new THREE.Points(particleGeo, particleMat);
    scene.add(particleSystem);

    // ----------------------------------------------------
    // 7. 상태 관리 및 인터랙션 (열기 + 드래그)
    // ----------------------------------------------------
    let isBoxOpened = false;
    let boxOpenProgress = 0;
    const characters = [];
    const numCharacters = 10;
    const circleRadius = 4.8;

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let draggedCharacter = null;

    function openGiftBox() {
      if (isBoxOpened) return;
      isBoxOpened = true;

      // 생일 축하 노래 멜로디 시작
      audioEngine.startHappyBirthdayMelody();

      particleMat.opacity = 1.0;

      // 시계 방향 캐릭터 등장
      for (let i = 0; i < numCharacters; i++) {
        const charObj = createKaneCharacter(false);
        const angle = (i / numCharacters) * Math.PI * 2;
        
        const tx = Math.sin(angle) * circleRadius;
        const tz = Math.cos(angle) * circleRadius;
        
        charObj.targetPos.set(tx, 0, tz);
        charObj.mesh.position.set(0, 0.8, 0);
        charObj.mesh.scale.set(0.01, 0.01, 0.01);
        charObj.spawnDelay = i * 0.12;
        
        charObj.baseYRotation = angle;
        charObj.mesh.rotation.y = charObj.baseYRotation;

        scene.add(charObj.mesh);
        characters.push(charObj);
      }

      // 정면 중앙 비보잉 캐릭터
      const bboyObj = createKaneCharacter(true);
      bboyObj.targetPos.set(0, 0, 2.2);
      bboyObj.mesh.position.set(0, 0.8, 0);
      bboyObj.mesh.scale.set(0.01, 0.01, 0.01);
      bboyObj.spawnDelay = 0.2;
      bboyObj.baseYRotation = 0;
      bboyObj.mesh.rotation.y = bboyObj.baseYRotation;

      scene.add(bboyObj.mesh);
      characters.push(bboyObj);
    }

    // 마우스 다운
    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#upload-container')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      // 캐릭터 드래그 체크
      if (isBoxOpened) {
        const charMeshes = characters.map(c => c.mesh);
        const charIntersects = raycaster.intersectObjects(charMeshes, true);

        if (charIntersects.length > 0) {
          let topGroup = charIntersects[0].object;
          while (topGroup.parent && topGroup.parent !== scene) {
            topGroup = topGroup.parent;
          }
          
          const found = characters.find(c => c.mesh === topGroup);
          if (found) {
            draggedCharacter = found;
            draggedCharacter.isBeingDragged = true;
            controls.enabled = false;
            return;
          }
        }
      }

      // 상자 열기 체크
      if (!isBoxOpened) {
        const boxIntersects = raycaster.intersectObjects(giftGroup.children, true);
        if (boxIntersects.length > 0) {
          openGiftBox();
        }
      }
    });

    // 마우스 이동 드래그
    window.addEventListener('pointermove', (e) => {
      if (!draggedCharacter) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(dragPlane);

      if (intersects.length > 0) {
        const p = intersects[0].point;
        draggedCharacter.targetPos.x = p.x;
        draggedCharacter.targetPos.z = p.z;
        draggedCharacter.mesh.position.x = p.x;
        draggedCharacter.mesh.position.z = p.z;
      }
    });

    // 드래그 종료
    window.addEventListener('pointerup', () => {
      if (draggedCharacter) {
        draggedCharacter.isBeingDragged = false;
        draggedCharacter = null;
        controls.enabled = true;
      }
    });

    // ----------------------------------------------------
    // 8. 파일 업로드 기능
    // ----------------------------------------------------
    const fileInput = document.getElementById('file-input');
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const newTexture = new THREE.Texture(img);
          newTexture.needsUpdate = true;

          allCharacterMaterials.forEach(mat => {
            mat.map = newTexture;
            mat.needsUpdate = true;
          });
          currentFaceTexture = newTexture;
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // ----------------------------------------------------
    // 9. 애니메이션 루프
    // ----------------------------------------------------
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      controls.update();

      if (!isBoxOpened) {
        const scalePulse = 1 + Math.sin(elapsed * 4) * 0.03;
        giftGroup.scale.set(scalePulse, scalePulse, scalePulse);
      } else {
        if (boxOpenProgress < 1.0) {
          boxOpenProgress += delta * 2.5;
          const easeProgress = Math.sin(Math.min(1.0, boxOpenProgress) * Math.PI / 2);
          lidHingeGroup.rotation.x = -easeProgress * (Math.PI * 0.75);
        }

        // 폭죽 파티클 모션
        if (particleMat.opacity > 0) {
          const positions = particleSystem.geometry.attributes.position.array;
          for (let i = 0; i < particleCount; i++) {
            positions[i * 3] += particleVels[i].x * delta;
            positions[i * 3 + 1] += particleVels[i].y * delta;
            positions[i * 3 + 2] += particleVels[i].z * delta;

            particleVels[i].y -= 12 * delta; // 중력
          }
          particleSystem.geometry.attributes.position.needsUpdate = true;
          particleMat.opacity -= delta * 0.35;
        }

        discoGroup.rotation.y = elapsed * 1.2;

        characters.forEach((char) => {
          if (char.spawnDelay > 0) {
            char.spawnDelay -= delta;
            return;
          }

          if (char.spawnProgress < 1.0) {
            char.spawnProgress += delta * 2.0;
            const p = Math.min(1.0, char.spawnProgress);
            const easeP = 1 - Math.pow(1 - p, 3);

            const currentX = THREE.MathUtils.lerp(char.startPos.x, char.targetPos.x, easeP);
            const currentZ = THREE.MathUtils.lerp(char.startPos.z, char.targetPos.z, easeP);
            const currentY = THREE.MathUtils.lerp(char.startPos.y, char.targetPos.y, easeP) + Math.sin(p * Math.PI) * 2.0;

            char.mesh.position.set(currentX, Math.max(0, currentY), currentZ);
            char.mesh.scale.set(easeP, easeP, easeP);
          } else {
            const t = elapsed * char.danceSpeed + char.dancePhase;

            if (char.isBboy) {
              const mode = Math.floor(elapsed % 8);
              if (mode < 4) {
                char.mesh.position.y = 0.8;
                char.mesh.rotation.x = Math.PI;
                char.mesh.rotation.y += delta * 12;
              } else {
                char.mesh.position.y = 0.5 + Math.abs(Math.sin(t * 3)) * 0.3;
                char.mesh.rotation.x = Math.PI / 3;
                char.mesh.rotation.z = Math.sin(t * 4) * 0.8;
                char.mesh.rotation.y = char.baseYRotation + Math.sin(t * 2) * 1.2;
              }
            } else {
              const bounceY = Math.abs(Math.sin(t * 2)) * 0.28;
              char.mesh.position.y = char.targetPos.y + bounceY;

              const rockAngle = Math.sin(t) * 0.22;
              char.mesh.rotation.z = rockAngle;
              char.mesh.rotation.y = char.baseYRotation + Math.cos(t) * 0.15;

              char.leftArmGroup.rotation.z = Math.sin(t) * 0.6 + 0.3;
              char.rightArmGroup.rotation.z = -Math.sin(t) * 0.6 - 0.3;
            }
          }
        });
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
